[project]
name = "myfpl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jørgen Riseth", email = "jnriseth@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fpl-db",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pulp>=3.3.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.70.0",
]

[project.scripts]
myfpl = "myfpl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
myfpl = { path = ".", editable = true }
fpl-db = { path = "fpl-db", editable = true }

[tool.uv.sources]
fpl-db = { workspace = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
jupyter = ">=1.1.1,<2"
notebook = ">=7.6.2,<8"

[tool.uv.workspace]
members = ["fpl-db"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=8.4.2",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
