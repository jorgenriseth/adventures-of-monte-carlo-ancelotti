[project]
name = "fpl-db"
version = "0.1.0"
description = "Package for managing a relational database holding historic data and data about upcoming fixtures in fantasy premier league."
readme = "README.md"
authors = [
    { name = "Jørgen Riseth", email = "jnriseth@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "python-dotenv>=1.1.1",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
